<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TO-DO</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="icon" href="./favicon.ico"/>

  <!-- Your CSS -->
  <link rel="stylesheet" href="./src/styles/index.css"/>
</head>
<body>
  <!-- NAVBAR (Black) with id mainNav -->
  <nav id="mainNav" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-light" href="#">📝 TO-DO</a>

    <div class="d-flex ms-auto align-items-center">
      <!-- visible when user is NOT logged in -->
      <button id="btnNewUser" class="btn btn-warning me-2 text-dark fw-semibold">New User</button>
      <button id="btnSignin" class="btn btn-outline-light fw-semibold">Sign In</button>

      <!-- hidden by default, shown when logged in -->
      <button id="btnNewAppointment" class="btn btn-primary ms-2" style="display:none">Add New Appointment</button>
      <button id="btnSignout" class="btn btn-danger ms-2" style="display:none">Signout</button>

      <!-- user label -->
      <span id="lblUser" class="text-light ms-3 fw-semibold" style="min-width:160px;"></span>
    </div>
  </div>
</nav>

  <!-- MAIN SECTION -->
  <section class="p-4 mt-5 pt-5"></section>

  <!-- FOOTER (Black) -->
  <footer class="text-center bg-dark text-light py-3 mt-auto shadow-sm fixed-bottom">
    <small>© 2025 TO-DO App | Made with ❤️</small>
  </footer>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- jquery.cookie plugin wrapper (we rely on Cookies lib) -->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
  <script>
    window.$.cookie = function(name, value, options) {
      if (typeof value === "undefined") {
        return Cookies.get(name);
      }
      if (value === null) {
        Cookies.remove(name);
        return;
      }
      Cookies.set(name, value, options || {});
    };
    window.$.removeCookie = function(name){ Cookies.remove(name); };
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your JS -->
  <script src="./src/scripts/index.js"></script>
</body>
</html>
