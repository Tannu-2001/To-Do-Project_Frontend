<div class="w-50 bg-light p-4">
  <h2>Add Appointment</h2>
  <dl>
    <dt>Appointment Id (optional)</dt>
    <dd><input type="text" id="appointment_id" class="form-control"></dd>
    <dt>Title</dt>
    <dd><input type="text" id="title" class="form-control"></dd>
    <dt>Description</dt>
    <dd><textarea id="description" class="form-control"></textarea></dd>
    <dt>Date</dt>
    <dd><input type="date" id="date" class="form-control"></dd>
  </dl>
  <div class="d-flex">
    <button id="btnAdd" class="btn btn-primary me-2">Add</button>
    <button id="btnCancel" class="btn btn-secondary">Cancel</button>
  </div>
</div>
